# Keep PX4's daemon lock file and client socket out of the periodic /tmp cleanup.
#
# PX4 creates /tmp/px4_lock-<instance> and /tmp/px4-sock-<instance> at boot,
# usually before the system clock has been set, so they carry a 1970 timestamp.
# systemd-tmpfiles-clean (15 min after boot, then daily) applies the
# "D /tmp ... 30d" rule and deletes the lock file as too old. The PX4 server
# keeps its lock on the now-deleted file, the next px4-* client recreates an
# unlocked file at the same path, and every px4-* command then reports
# "PX4 server not running" until voxl-px4 is restarted.
#
# "x" excludes matching paths from age-based cleanup (see man tmpfiles.d).
x /tmp/px4_lock-*
x /tmp/px4-sock-*
